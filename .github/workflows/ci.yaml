name: CI

# Upstream's own workflow. Its first step starts a Minio server with
# `docker compose up -d`, and our runners cannot pull the minio/minio image, so
# every job fails within seconds before any code runs. Left in place, but only
# on demand: the lint and unit tests it would have run are covered by test.yml,
# and the integration tests need a Minio anyone running this by hand can provide.
on:
  workflow_dispatch:

env:
  LOGGING_CONF_FILE: ./sample_logging.conf

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Minio server
        run: |
          mkdir -p ./minio/data/awesome-bucket
          docker compose up -d

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup virtual env
        run: make venv

      - name: Pylinting
        run: make pylint

      - name: Unit Tests
        run: make unit_tests

      - name: Integration Tests
        run: make integration_tests